name: Pruebas del sitio
on: pull_request
permissions:
  contents: read
jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Playwright 1.56.1 / Ubuntu Noble; digest verificado en MCR.
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --init --shm-size=1gb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
