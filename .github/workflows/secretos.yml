name: Búsqueda de secretos
on: pull_request
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar Gitleaks verificado
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Revisar PR e historial completo
        shell: bash
        run: |
          set -euo pipefail
          # No publicar fragmentos, autores ni informes que puedan contener datos personales.
          if "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml \
            --log-opts="--all" --ignore-gitleaks-allow --redact=100 \
            --no-banner --log-level error > "$RUNNER_TEMP/gitleaks.log" 2>&1; then
            echo 'Análisis completado sin hallazgos fuera de la lista permitida.'
          else
            echo '::error::El análisis de secretos requiere revisión privada de Alejandro. No publique valores ni fragmentos en comentarios.'
            exit 1
          fi
